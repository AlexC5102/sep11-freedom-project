<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rocket Dino</title>

  <script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>
</head>

<body>

<script>

kaboom({
  background: [245, 245, 245], // sets background color
})

function clamp(v, min, max) { // keeps value between min and max
  return Math.max(min, Math.min(max, v))
}

setGravity(1100) // adds gravity to game world

// load sprites (game images)
loadSprite("dino", "sprite-folder/sprite1.png")
loadSprite("cactus", "sprite-folder/sprite2.png")
loadSprite("asteroids", "sprite-folder/asteroid.png")
loadSprite("rocketLauncher", "sprite-folder/rocket-launcher.png")
loadSprite("rocket", "sprite-folder/rocket.png")

scene("game", () => {

  var score = 0 // tracks score
  var speed = 600 // player speed

  const groundY = height() - 50 // ground position
  var highScore = Number(localStorage.getItem("highScore") || 0) // saved best score

  var canShoot = true // controls shooting cooldown
  const fireRate = 700 // delay between shots
  // ground
  add([
    rect(width(), 50),
    pos(0, groundY),
    area(),
    body({ isStatic: true }),
    color(30, 30, 30),
  ])
  // player
  const player = add([
    sprite("dino"),
    pos(80, groundY),
    anchor("bot"),
    body(),
    area(),
    scale(0.9),
  ])

  const launcher = add([
    sprite("rocketLauncher"),
    pos(player.pos.x + 28, player.pos.y - 45),
    anchor("center"),
    scale(0.4), // rocket launcher
  ])

  launcher.onUpdate(() => {
    launcher.pos.x = player.pos.x + 28 // follow player x
    launcher.pos.y = player.pos.y - 45 // follow player y

    const dir = mousePos().sub(launcher.pos) // direction to mouse
    launcher.angle = dir.angle() // rotate toward mouse
  })

  onKeyPress("space", () => {
    if (player.isGrounded()) player.jump(520) // jump only if on ground
  })

  function shootRocket() {

    if (!canShoot) return // stop if cooling down

    canShoot = false // start cooldown
    wait(fireRate / 875, () => canShoot = true) // reset cooldown

    const startPos = vec2(launcher.pos.x + 25, launcher.pos.y) // rocket start position
    const dir = mousePos().sub(startPos).unit() // direction to mouse

    const rocketObj = add([
      sprite("rocket"), pos(startPos), anchor("center"), area(),
      scale(0.25), rotate(dir.angle()), z(20), "rocket", // rocket setup

      {
        speed: 700, // rocket speed
        dir, // direction

        update() {
          this.pos = this.pos.add(this.dir.scale(this.speed * dt())) // move rocket
        }
      }
    ])

    rocketObj.onCollide("asteroid", (a) => {
      if (!a.exists()) return // check asteroid
      destroy(a) // remove asteroid
      destroy(rocketObj) // remove rocket
    })
  }

  onKeyPress("r", shootRocket) // shoot rocket on R key

  function spawnCactusPattern() {

    const pattern = choose([[1],[1,1]]) // random cactus pattern
    const startX = width() + 100 // spawn off screen

    for (var i = 0; i < pattern.length; i++) {
      if (pattern[i] === 1) {

        add([
          sprite("cactus"),
          pos(startX + i * 45, groundY),
          anchor("bot"),
          area(),
          move(LEFT, speed), // move left
          "enemy",
          scale(rand(0.55, 0.6)), // random size
        ])

      }
    }

    wait(rand(1.0, 1.5), spawnCactusPattern) // repeat spawning
  }

  function spawnAsteroidBelt() {

    const difficulty = clamp(score / 500, 0, 1) // increases difficulty
    const count = randi(3, 6) // number of asteroids

    for (var i = 0; i < count; i++) {

      wait(i * 0.35, () => {

        add([
          sprite("asteroids"),
          pos(rand(0, width()), -60),
          anchor("center"),
          area(),
          "asteroid", "enemy",

          {
            fall: lerp(240, 520, difficulty), // fall speed
            drift: rand(-60, 60), // side movement

            update() {
              this.pos.y += this.fall * dt() // move down
              this.pos.x += this.drift * dt() // move sideways
              this.angle += dt() * 120 // rotate
            }
          }
        ])

      })

    }

    wait(rand(2.0, 3.5), spawnAsteroidBelt) // repeat wave
  }

  spawnCactusPattern() // start cactuses
  spawnAsteroidBelt() // start asteroids

  player.onCollide("enemy", () => {

    const finalScore = Math.floor(score) // final score

    if (finalScore > highScore) {
      highScore = finalScore // update high score
      localStorage.setItem("highScore", highScore) // save score
    }

    go("gameover", finalScore) // go to game over
  })

  const scoreText = add([
    text("0"),
    pos(width() - 120, 5),
    color(0, 0, 0), // score display
  ])

  const highScoreText = add([
    text("Best: " + highScore),
    pos(width() - 120, 40),
    color(0, 0, 0), // high score display
  ])

  onUpdate(() => {

    score += dt() * 10 // increase score over time
    speed = 600 + score * 0.55 // increase difficulty

    scoreText.text = Math.floor(score) // update score text
    highScoreText.text = highScore // update best score
  })

})

scene("gameover", (score) => {

  add([
    text(
      "SURVIVAL FAILED\n\n" +
      score +
      "\n\nBest: " +
      localStorage.getItem("highScore") +
      "\n\nPRESS SPACE TO RESTART"
    ),
    pos(width()/2, height()/2),
    anchor("center"),
    color(0, 0, 0), // game over text
  ])

  onKeyPress("space", () => go("game")) // restart game
})

go("game") // start game

</script>

</body>
</html>
